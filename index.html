<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guidance System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #4e73df, #1cc88a);
        }
        nav {
            background: #2c3e50;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
        }
        .container {
            width: 80%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        button {
            background: #4e73df;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #2e59d9;
        }
        .hidden {
            display: none;
        }
        .result {
            background: #f8f9fc;
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
            line-height: 1.6;
        }
        .center {
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 15px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <nav>
        <i class="fa-solid fa-graduation-cap"></i> Career Guidance System
    </nav>

    <!-- PAGE 1: Registration -->
    <div class="container" id="registerPage">
        <h1>Student Registration</h1>
        <input type="text" id="regName" placeholder="Enter Your Name">
        <input type="email" placeholder="Enter Email">
        <input type="password" placeholder="Create Password">
        <button onclick="startSystem()">
            <i class="fa-solid fa-user-plus"></i> Register
        </button>
    </div>

    <!-- PAGE 2: Career Goal -->
    <div class="container hidden" id="goalPage">
        <h1>Find Your Career Path</h1>
        <label>Select Your Goal:</label>
        <select id="goal">
            <option value="">-- Select Goal --</option>
            <option value="doctor">Doctor</option>
            <option value="nurse">Nurse</option>
            <option value="engineer">Engineer</option>
            <option value="law">Law & Administration</option>
            <option value="banking">Banking & Commerce</option>
            <option value="teacher">Teacher / Lecturer</option>
            <option value="defence">Defence Services</option>
            <option value="software">Software Developer</option>
            <option value="designer">Graphic Designer</option>
            <option value="journalist">Journalist</option>
            <option value="entrepreneur">Entrepreneur</option>
            <option value="pharmacist">Pharmacist</option>
            <option value="chartered">Chartered Accountant</option>
        </select>
        <button onclick="showCareer()">
            <i class="fa-solid fa-lightbulb"></i> Get Career Details
        </button>
    </div>

    <!-- PAGE 3: Career Details -->
    <div class="container hidden" id="detailsPage">
        <h1>Career Roadmap</h1>
        <div class="result" id="output"></div>
        <div class="center">
            <button onclick="goWish()">Continue</button>
        </div>
    </div>

    <!-- PAGE 4: Final Message -->
    <div class="container hidden" id="wishPage">
        <h1>🎉 Congratulations!</h1>
        <p id="finalWish"></p>
        <button onclick="restart()">Start Again</button>
    </div>

    <footer>
        © 2026 Career Guidance System
    </footer>

    <script>
        var studentName = "";

        function startSystem() {
            studentName = document.getElementById("regName").value;
            if (studentName === "") {
                alert("Please enter your name");
                return;
            }
            document.getElementById("registerPage").classList.add("hidden");
            document.getElementById("goalPage").classList.remove("hidden");
        }

        function showCareer() {
            var goal = document.getElementById("goal").value;
            if (goal === "") {
                alert("Please select a goal");
                return;
            }
            var careers = {
                doctor: `
                    <h3>Doctor</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (BiPC).</li>
                        <li>Complete 12th with BiPC.</li>
                        <li>Prepare for NEET exam.</li>
                        <li>Enroll in MBBS degree (5.5 years).</li>
                        <li>After MBBS, optional specialization (MD/MS).</li>
                    </ol>
                `,
                nurse: `
                    <h3>Nurse</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (BiPC).</li>
                        <li>Complete 12th with BiPC.</li>
                        <li>Enroll in B.Sc Nursing (4 years).</li>
                        <li>After B.Sc Nursing, optional specialization (M.Sc Nursing).</li>
                    </ol>
                `,
                engineer: `
                    <h3>Engineer</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (MPC).</li>
                        <li>Complete 12th with MPC.</li>
                        <li>Prepare for JEE or state engineering entrance exams.</li>
                        <li>Enroll in B.Tech or B.E (4 years).</li>
                        <li>After B.Tech, optional M.Tech or specialization.</li>
                    </ol>
                `,
                law: `
                    <h3>Law & Administration</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (CEC or HEC).</li>
                        <li>Complete 12th with any group (Arts/Commerce).</li>
                        <li>Prepare for CLAT or law entrance exams.</li>
                        <li>Enroll in BA LLB or LLB (integrated or 3-year).</li>
                        <li>After LLB, optional specialization (Judiciary exams).</li>
                    </ol>
                `,
                banking: `
                    <h3>Banking & Commerce</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (MEC or CEC).</li>
                        <li>Complete 12th with Commerce/Economics.</li>
                        <li>Enroll in B.Com or BBA (3 years).</li>
                        <li>Prepare for banking exams (IBPS, SBI, etc.).</li>
                        <li>Optional: Pursue CA or MBA for advanced careers.</li>
                    </ol>
                `,
                teacher: `
                    <h3>Teacher / Lecturer</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, any Intermediate group works (Arts/Science/Commerce).</li>
                        <li>Complete 12th with any stream.</li>
                        <li>Enroll in a degree (BA, B.Sc, etc.).</li>
                        <li>After degree, do B.Ed (2 years).</li>
                        <li>Apply for teaching jobs or further postgraduate studies.</li>
                    </ol>
                `,
                defence: `
                    <h3>Defence Services</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (MPC preferred).</li>
                        <li>Complete 12th with MPC.</li>
                        <li>Prepare for NDA (National Defence Academy exam).</li>
                        <li>Join NDA, complete training, and become a commissioned officer.</li>
                    </ol>
                `,
                software: `
                    <h3>Software Developer</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (MPC).</li>
                        <li>Complete 12th with MPC.</li>
                        <li>Enroll in B.Tech (Computer Science) or BCA.</li>
                        <li>Learn programming languages (Python, Java, etc.).</li>
                        <li>Apply for software development roles or further studies (M.Tech, etc.).</li>
                    </ol>
                `,
                designer: `
                    <h3>Graphic Designer</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, any Intermediate group works.</li>
                        <li>Complete 12th with any stream.</li>
                        <li>Enroll in design courses (e.g., B.Des, graphic design diploma).</li>
                        <li>Build a portfolio and apply for design jobs or freelancing.</li>
                    </ol>
                `,
                journalist: `
                    <h3>Journalist</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, any Intermediate group works.</li>
                        <li>Complete 12th with any stream.</li>
                        <li>Enroll in BA Journalism or Mass Communication (3 years).</li>
                        <li>Intern at media houses, and build a portfolio.</li>
                    </ol>
                `,
                entrepreneur: `
                    <h3>Entrepreneur</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, any Intermediate group works.</li>
                        <li>Complete 12th with any stream.</li>
                        <li>Enroll in BBA or business-related degree.</li>
                        <li>Learn business skills, start small ventures, and grow!</li>
                    </ol>
                `,
                pharmacist: `
                    <h3>Pharmacist</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (BiPC).</li>
                        <li>Complete 12th with BiPC.</li>
                        <li>Enroll in B.Pharmacy (4 years).</li>
                        <li>After B.Pharmacy, optional specialization (M.Pharmacy).</li>
                    </ol>
                `,
                chartered: `
                    <h3>Chartered Accountant</h3>
                    <b>Step-by-Step Process:</b>
                    <ol>
                        <li>After 10th, choose Intermediate (MEC or CEC).</li>
                        <li>Complete 12th with commerce/economics.</li>
                        <li>Register for CA Foundation.</li>
                        <li>Clear all levels of CA (Foundation, Inter, Final).</li>
                        <li>Complete articleship, and become a Chartered Accountant.</li>
                    </ol>
                `
            };
            document.getElementById("output").innerHTML = careers[goal];
            document.getElementById("goalPage").classList.add("hidden");
            document.getElementById("detailsPage").classList.remove("hidden");
        }

        function goWish() {
            document.getElementById("detailsPage").classList.add("hidden");
            document.getElementById("wishPage").classList.remove("hidden");
            document.getElementById("finalWish").innerHTML =
                "Dear <b>" + studentName + "</b>,<br><br>" +
                "Believe in yourself and work hard.<br>" +
                "Your dream career is possible with dedication and consistency.<br><br>" +
                "All the best for your bright future 🚀";
        }

        function restart() {
            location.reload();
        }
    </script>
</body>
</html>
