<!DOCTYPE html>
<html>
<head>
    <title>Career Guidance System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #4e73df, #1cc88a);
        }

        nav {
            background: #2c3e50;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
        }

        .container {
            width: 85%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: 500;
        }

        select, input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            background: #4e73df;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #2e59d9;
        }

        .hidden {
            display: none;
        }

        .result {
            background: #f8f9fc;
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
            line-height: 1.6;
        }

        .wish-box {
            text-align: center;
            font-size: 18px;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>

<nav>
    <i class="fa-solid fa-graduation-cap"></i> Career Guidance System
</nav>

<!-- PAGE 1 -->
<div class="container" id="page1">
    <h1>Find Your Career Path</h1>

    <label>Enter Your Name:</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Select Your Goal:</label>
    <select id="goal">
        <option value="">-- Select Goal --</option>
        <option value="doctor">Doctor</option>
        <option value="engineer">Engineer</option>
        <option value="law">Law & Administration</option>
        <option value="banking">Banking & Commerce</option>
        <option value="government">Government Jobs</option>
        <option value="teacher">Teacher / Lecturer</option>
        <option value="defence">Defence Services</option>
        <option value="software">Software Developer</option>
        <option value="data">Data Scientist</option>
        <option value="designer">Graphic Designer</option>
        <option value="journalist">Journalist</option>
        <option value="entrepreneur">Entrepreneur</option>
        <option value="pharmacist">Pharmacist</option>
        <option value="nurse">Nurse</option>
        <option value="chartered">Chartered Accountant</option>
    </select>

    <button onclick="goToNextPage()">
        <i class="fa-solid fa-lightbulb"></i> Get Career Details
    </button>
</div>

<!-- PAGE 2 -->
<div class="container hidden" id="page2">
    <h1>Career Details</h1>
    <div class="result" id="output"></div>

    <div class="wish-box" id="wishMessage"></div>

    <button onclick="goBack()">⬅ Back</button>
</div>

<footer>
    © 2026 Career Guidance System | Designed Professionally
</footer>

<script>
function goToNextPage() {

    var name = document.getElementById("name").value;
    var goal = document.getElementById("goal").value;

    if(name === "" || goal === "") {
        alert("Please enter your name and select a goal.");
        return;
    }

    var careers = {
        doctor: "Group: BiPC<br>Courses: MBBS, BDS<br>Steps:<br>1. Choose BiPC<br>2. Prepare for NEET<br>3. Join Medical College",
        engineer: "Group: MPC<br>Courses: B.Tech, B.E<br>Steps:<br>1. Choose MPC<br>2. Prepare for JEE/EAMCET<br>3. Join Engineering College",
        law: "Group: CEC/HEC<br>Courses: LLB, BA LLB<br>Steps:<br>1. Choose CEC<br>2. Prepare for CLAT<br>3. Join Law College",
        banking: "Group: MEC/CEC<br>Courses: B.Com, CA<br>Steps:<br>1. Complete B.Com<br>2. Prepare for Bank Exams",
        government: "Group: HEC<br>Courses: BA<br>Steps:<br>1. Complete Degree<br>2. Prepare for UPSC/Group Exams",
        teacher: "Group: Any Stream<br>Courses: B.Ed<br>Steps:<br>1. Complete Degree<br>2. Do B.Ed<br>3. Apply Teaching Exams",
        defence: "Group: MPC/Any<br>Courses: NDA, CDS<br>Steps:<br>1. Prepare NDA/CDS<br>2. Physical Training<br>3. Join Defence Academy",
        software: "Group: MPC<br>Courses: B.Tech CSE, BCA<br>Steps:<br>1. Learn Programming<br>2. Build Projects<br>3. Apply IT Jobs",
        data: "Group: MPC<br>Courses: Data Science<br>Steps:<br>1. Learn Python<br>2. Study Statistics<br>3. Build Projects",
        designer: "Group: Any<br>Courses: B.Des, Animation<br>Steps:<br>1. Learn Design Tools<br>2. Build Portfolio",
        journalist: "Group: Any<br>Courses: BA Journalism<br>Steps:<br>1. Improve Communication<br>2. Join Internship",
        entrepreneur: "Group: Any<br>Courses: BBA, MBA<br>Steps:<br>1. Learn Business Skills<br>2. Start Your Startup",
        pharmacist: "Group: BiPC<br>Courses: B.Pharmacy<br>Steps:<br>1. Choose BiPC<br>2. Join Pharmacy College",
        nurse: "Group: BiPC<br>Courses: B.Sc Nursing<br>Steps:<br>1. Choose BiPC<br>2. Join Nursing College",
        chartered: "Group: MEC<br>Courses: CA<br>Steps:<br>1. Register CA Foundation<br>2. Clear Exams<br>3. Complete Articleship"
    };

    document.getElementById("output").innerHTML = careers[goal];

    document.getElementById("wishMessage").innerHTML =
        "<br><br>🎉 <b>Best wishes " + name + "!</b><br>" +
        "Stay focused, work hard, and never give up.<br>" +
        "You can definitely achieve your dream career! 🚀";

    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
}

function goBack() {
    document.getElementById("page2").classList.add("hidden");
    document.getElementById("page1").classList.remove("hidden");
}
</script>

</body>
</html>
